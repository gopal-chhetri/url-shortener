<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found</title>
  <meta name="description" content="This short link doesn't exist, or its owner disabled or deleted it." />
  <meta property="og:title" content="Page Not Found" />
  <meta property="og:description" content="This short link doesn't exist, or its owner disabled or deleted it." />
  <meta property="og:image" content="/app/logo.png" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="/app/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=fallback" rel="stylesheet" />
  <link rel="stylesheet" href="/app/tokens.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem;
      text-align: center;
    }
    .code {
      font-family: var(--font-code);
      font-size: 6rem;
      font-weight: 600;
      line-height: 1;
      color: var(--trace);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--muted);
      margin-bottom: 2rem;
      max-width: 400px;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      min-height: var(--touch-min);
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      text-decoration: none;
      transition: background var(--transition), border-color var(--transition);
    }
    .btn-primary { background: var(--trace); color: var(--on-trace); }
    .btn-primary:hover { background: var(--trace-deep); }
    .btn-ghost { color: var(--text); border: 1px solid var(--border-strong); }
    .btn-ghost:hover { border-color: var(--text); }
  </style>
</head>
<body>

  <div class="code">404</div>
  <h1>This link doesn't go anywhere</h1>
  <p>Check the code for typos. If it's right, the owner may have disabled or deleted the link.</p>
  <div class="actions">
    <a href="/app/landing.html" class="btn btn-primary">ShortURL home</a>
    <a href="/app/" class="btn btn-ghost">Go to dashboard</a>
  </div>

</body>
</html>
